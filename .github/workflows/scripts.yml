name: scripts
on:
  push:
    paths: ['scripts/**', '.github/workflows/scripts.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/scripts.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test/*.test.mjs
      - run: shellcheck -x scripts/build-ptc.sh scripts/deploy.sh scripts/digest.sh scripts/install-timers.sh scripts/lib.sh scripts/notify.sh scripts/probe.sh scripts/prune.sh scripts/run-daily.sh
